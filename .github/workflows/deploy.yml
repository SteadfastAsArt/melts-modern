name: Deploy

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy to ECS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd /opt/melts-modern
            git pull --ff-only origin master
            sudo systemctl restart melts-modern

            # The static shell is public even with SSO enabled. Check its
            # identity: a wrong nginx vhost can return HTTP 200 for another app.
            # /api/me may return 401 without a session, but never 404 or 5xx.
            check_melts() {
              page=$(curl -fsS --connect-timeout 3 --max-time 5 "$1/static/index.html") || return 1
              printf '%s\n' "$page" | grep -Fq '<title>MELTS Modern</title>' || return 1
              code=$(curl -sS --connect-timeout 3 --max-time 5 \
                -o /dev/null -w '%{http_code}' "$1/api/me") || return 1
              case "$code" in
                200|401) ;;
                *) echo "Unexpected /api/me status: $code"; return 1 ;;
              esac
              # Follow the anonymous browser flow too: serving static files
              # is insufficient if the SSO login entrypoint returns 503.
              curl -fsSL --connect-timeout 3 --max-time 10 --max-redirs 5 \
                -o /dev/null "$1/"
            }

            echo "=== Backend and public route health checks ==="
            for base in http://127.0.0.1:9000 https://melts.astrax.art; do
              for i in $(seq 1 10); do
                if check_melts "$base"; then
                  echo "MELTS healthy at $base after ${i} attempts"
                  break
                fi
                if [ "$i" -eq 10 ]; then
                  echo "MELTS health check failed at $base"
                  sudo journalctl -u melts-modern -n 25 --no-pager
                  exit 1
                fi
                sleep 1
              done
            done
